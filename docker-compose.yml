services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: nutricore, POSTGRES_USER: nutricore, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}" }
    volumes: ["${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data", "${BACKUP_PATH:-./backups}:/backups"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nutricore"], interval: 10s, timeout: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"], interval: 30s, timeout: 5s, retries: 3 }
