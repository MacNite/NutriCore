name: nutricore

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutricore}
      POSTGRES_USER: ${POSTGRES_USER:-nutricore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Keeps the data directory usable across minor image upgrades.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # On TrueNAS these are dataset mount points; see README.
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
      - ${BACKUP_PATH:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutricore} -d ${POSTGRES_DB:-nutricore}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # The database is only reachable from the compose network, never published.
    expose:
      - "5432"

  app:
    # Published by .github/workflows/publish.yml. Pin a version tag in .env for
    # a reproducible deployment; `latest` only ever points at a release.
    image: ${APP_IMAGE:-ghcr.io/macnite/nutricore:latest}
    # Kept so `docker compose up -d --build` still builds locally from source.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Built from the compose credentials so the URL cannot drift from them.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutricore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nutricore}?schema=public

      # --- AI -------------------------------------------------------------
      # Ollama is NOT started by this stack: it already runs elsewhere on the
      # network. Point AI_BASE_URL and AI_MODEL at it in .env; models are
      # pulled on the Ollama host (`ollama pull qwen3.5:4b`), never here.
      #
      # AI_BASE_URL, AI_MODEL, SEARXNG_URL and the rest are deliberately NOT
      # repeated here: `environment:` overrides `env_file:`, so a default
      # written in this file would silently win over the value in .env.
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    # Uncomment together with the networks block below when Ollama runs in a
    # different compose stack, so `AI_BASE_URL` can use its service name.
    # networks:
    #   - default
    #   - ollama

  worker:
    image: ${APP_IMAGE:-ghcr.io/macnite/nutricore:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutricore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nutricore}?schema=public
      # The one variable that makes this the worker rather than a second app.
      # Everything else comes from .env via `env_file`, exactly as for `app`.
      NUTRICORE_PROCESS: worker
    depends_on:
      db:
        condition: service_healthy

# networks:
#   ollama:
#     external: true
#     name: <name of the network the Ollama container is attached to>
