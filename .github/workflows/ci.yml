name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  APP_SECRET: ci-only-secret-value-at-least-32-characters
  DATABASE_URL: postgresql://nutricore:nutricore@127.0.0.1:5432/nutricore?schema=public
  TEST_DATABASE_URL: postgresql://nutricore:nutricore@127.0.0.1:5432/nutricore?schema=public

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: nutricore
          POSTGRES_USER: nutricore
          POSTGRES_PASSWORD: nutricore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutricore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          APP_URL: http://127.0.0.1:3100
          PORT: 3100
          E2E_PORT: 3100
          # Open Food Facts is not called from CI.
          OPENFOODFACTS_ENABLED: "false"
          # The suite registers one account per test from a single address.
          RATE_LIMIT_MULTIPLIER: "50"
          # Same reason. The default `bootstrap` mode closes registration once
          # the first account exists, which is the point of it - but this suite
          # needs a fresh account per test, so it opts into open registration
          # exactly as it opts into a relaxed rate limit. The policy itself is
          # covered by src/server/registration.test.ts and
          # tests/registration-bootstrap.test.ts.
          REGISTRATION_MODE: open

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  datasets:
    # The bundled food databases, imported into a real PostgreSQL instance.
    #
    # A separate job on purpose. The assertions in tests/food-datasets.test.ts
    # need the data to have been imported, and importing 15,296 foods into the
    # `test` job's database would also put them in front of the end-to-end
    # suite, which searches for foods it creates itself. Isolating it keeps
    # both honest, and proves on every pull request that the committed
    # artifacts still import - which is the one thing a unit test with a
    # temporary fixture directory cannot show.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: nutricore
          POSTGRES_USER: nutricore
          POSTGRES_PASSWORD: nutricore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutricore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # The real thing: BLS 4.0 plus both USDA releases, from the committed
      # artifacts, into a database that has only ever seen migrations.
      - name: Import the bundled food databases
        run: npm run db:import:foods

      - name: Verify the imported data
        run: npx vitest run tests/food-datasets.test.ts src/server/food-datasets

      # Running it again must cost one query per dataset and change nothing,
      # because a deployment may repeat it.
      - name: Re-import, to prove it is idempotent
        run: npm run db:import:foods

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the production image still builds, which is what deployment runs.
      - run: docker build -t nutricore:ci .
      # The migration runner is a separate image and the only one carrying the
      # Prisma CLI. Loading the CLI there catches missing runtime-only
      # transitive dependencies before an image can enter the container restart
      # loop seen in production - the same check as before, moved to the image
      # that now actually runs migrations.
      - run: docker build -t nutricore-migrate:ci --target migrate .
      - name: Smoke-test the migration runner's Prisma CLI
        run: >-
          docker run --rm --entrypoint node nutricore-migrate:ci
          ./node_modules/prisma/build/index.js --version

      # The other half of that split, asserted rather than assumed: the image
      # that serves traffic must NOT carry the CLI, because it drags in `effect`
      # and `deepmerge-ts` and their advisories. Without this, a future change
      # could quietly put them back.
      # `sh -c` rather than `--entrypoint test`, which would depend on a `test`
      # binary being on PATH in the image.
      - name: The runtime image must not carry the Prisma CLI
        run: |
          if docker run --rm --entrypoint sh nutricore:ci -c 'test -e ./node_modules/prisma/build/index.js'; then
            echo "The Prisma CLI is present in the runtime image; it belongs only in the migrate image." >&2
            exit 1
          fi
          echo "Runtime image carries no Prisma CLI, as intended."

      # The runtime image still has to be able to talk to the database, which is
      # what makes removing the CLI safe rather than merely smaller.
      - name: The runtime image can still load @prisma/client
        run: >-
          docker run --rm --entrypoint node nutricore:ci
          -e "require('@prisma/client').PrismaClient; console.log('@prisma/client loads')"
